name: Compilar Ejecutables Multiplataforma

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: SPARTACO-Auditor-Windows
            sep: ";"
            built: dist/SPARTACO-Auditor-Windows.exe
            upload: dist/SPARTACO-Auditor-Windows.exe
          - os: ubuntu-22.04
            name: SPARTACO-Auditor-Linux
            sep: ":"
            built: dist/SPARTACO-Auditor-Linux
            upload: dist/SPARTACO-Auditor-Linux
          - os: macos-latest
            name: SPARTACO-Auditor-macOS
            sep: ":"
            built: dist/SPARTACO-Auditor-macOS.app
            upload: dist/SPARTACO-Auditor-macOS.zip

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config python3-dev libcairo2-dev libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.0

      - name: Instalar dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then pip install "pygobject<3.51"; fi
          pip install pywebview "pyinstaller>=6,<7"

      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "${{ matrix.name }}" --add-data "modules${{ matrix.sep }}modules" --collect-all webview --hidden-import json --hidden-import hashlib --hidden-import concurrent.futures --hidden-import dataclasses --hidden-import math --hidden-import time --hidden-import typing rum.py

      - name: Compilar (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --name "${{ matrix.name }}" --add-data "modules${{ matrix.sep }}modules" --collect-all webview --hidden-import json --hidden-import hashlib --hidden-import concurrent.futures --hidden-import dataclasses --hidden-import math --hidden-import time --hidden-import typing rum.py

      - name: Compilar (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "${{ matrix.name }}" --add-data "modules${{ matrix.sep }}modules" --collect-all webview --hidden-import json --hidden-import hashlib --hidden-import concurrent.futures --hidden-import dataclasses --hidden-import math --hidden-import time --hidden-import typing rum.py
          ditto -c -k --sequesterRsrc --keepParent "${{ matrix.built }}" "${{ matrix.upload }}"

      - name: Verificar que el ejecutable arranca (--check)
        if: runner.os != 'macOS'
        run: ${{ matrix.built }} --check

      - name: Verificar que el ejecutable arranca (macOS)
        if: runner.os == 'macOS'
        run: dist/${{ matrix.name }}.app/Contents/MacOS/${{ matrix.name }} --check

      - name: Subir ejecutable al Release de GitHub
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.upload }}

      - name: Guardar como artefacto (ejecución manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.upload }}
